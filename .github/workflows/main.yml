name: Docker CI/CD Deployment to AWS EC2

on:
  push:
    branches: [ "master", "main" ]

jobs:
  deploy:
    name: Build & Deploy Docker Container to EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy Container to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Navigate to project folder
            cd /var/www/WanderStay
            
            # 2. Pull latest code from GitHub
            git pull origin master
            
            # 3. Build multi-stage production Docker image
            docker build -t wanderstay-app .
            
            # 4. Stop and remove existing container if running
            docker stop wanderstay-container || true
            docker rm wanderstay-container || true
            
            # 5. Run new container mapping port 80 to 8080 with environment variables
            docker run -d \
              --name wanderstay-container \
              --restart unless-stopped \
              --env-file /var/www/WanderStay/.env \
              -p 80:8080 \
              wanderstay-app
            
            # 6. Clean up unused build cache images
            docker image prune -f
